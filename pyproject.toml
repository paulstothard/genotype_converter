[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genotype-converter"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "mappy>=2.24",
    "click>=8.0",
]

[project.scripts]
genotype-converter = "genotype_converter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
